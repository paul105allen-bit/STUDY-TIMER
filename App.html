
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Study Timer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10152e, #303b70);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 450px;
    background: #1c2243;
    padding: 30px 20px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 35px #0006;
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #aaaed0;
    margin-bottom: 30px;
}

/* Timer */
.timer-circle {
    width: 240px;
    height: 240px;
    border: 8px solid #6475ff;
    border-radius: 50%;
    margin: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 25px #6475ff55;
}

.timer {
    font-size: 43px;
    font-weight: bold;
}

.timer-label {
    margin-top: 10px;
    color: #aaaed0;
    font-size: 13px;
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

button {
    padding: 13px 17px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.start {
    background: #38d99b;
    color: #102b25;
}

.pause {
    background: #ffbd59;
    color: #33230c;
}

.reset {
    background: #ff647c;
    color: white;
}

/* Total hours */
.study-hours {
    background: #292f57;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 25px;
}

.study-hours h2 {
    font-size: 17px;
    margin-bottom: 12px;
    color: #c3caff;
}

.total-time {
    font-size: 32px;
    font-weight: bold;
    color: #38d99b;
}

/* Rewards */
.rewards {
    background: #292f57;
    padding: 20px;
    border-radius: 15px;
}

.rewards h2 {
    margin-bottom: 10px;
}

.reward-description {
    font-size: 13px;
    color: #aaaed0;
    margin-bottom: 20px;
}

.diamonds {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.reward {
    text-align: center;
}

.diamond {
    width: 55px;
    height: 55px;
    background: #424a78;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 29px;
    filter: grayscale(1);
    opacity: 0.35;
    transition: 0.3s;
}

.diamond.unlocked {
    filter: none;
    opacity: 1;
    background: #414e87;
    box-shadow: 0 0 15px #38d9ff77;
}

.reward-text {
    font-size: 11px;
    color: #aaaed0;
    margin-top: 7px;
}

footer {
    margin-top: 22px;
    font-size: 12px;
    color: #818ab7;
}

@media(max-width: 380px) {
    .timer-circle {
        width: 210px;
        height: 210px;
    }

    .timer {
        font-size: 36px;
    }

    button {
        padding: 12px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>📚 Study Tracker</h1>
    <p class="subtitle">Focus today. Achieve tomorrow.</p>

    <!-- Main Timer -->
    <div class="timer-circle">
        <div class="timer" id="timer">00:00:00</div>
        <div class="timer-label">STUDY TIME</div>
    </div>

    <!-- Timer Buttons -->
    <div class="buttons">
        <button class="start" onclick="startTimer()">▶ Start</button>
        <button class="pause" onclick="pauseTimer()">⏸ Pause</button>
        <button class="reset" onclick="resetTimer()">↻ Reset</button>
    </div>

    <!-- Total Study Hours -->
    <div class="study-hours">
        <h2>⏱ Total Study Hours</h2>
        <div class="total-time" id="totalHours">0h 0m</div>
    </div>

    <!-- Diamond Rewards -->
    <div class="rewards">
        <h2>💎 Study Rewards</h2>
        <p class="reward-description">
            Complete study milestones to unlock diamonds!
        </p>

        <div class="diamonds">

            <div class="reward">
                <div class="diamond" id="diamond1">💎</div>
                <div class="reward-text">1 Hour</div>
            </div>

            <div class="reward">
                <div class="diamond" id="diamond2">💎</div>
                <div class="reward-text">5 Hours</div>
            </div>

            <div class="reward">
                <div class="diamond" id="diamond3">💎</div>
                <div class="reward-text">10 Hours</div>
            </div>

            <div class="reward">
                <div class="diamond" id="diamond4">💎</div>
                <div class="reward-text">25 Hours</div>
            </div>

        </div>
    </div>

    <footer>Every minute counts. Keep going! 🚀</footer>

</div>

<script>

// Load saved study time
let totalSeconds = Number(localStorage.getItem("totalStudySeconds")) || 0;

// Current session time
let sessionSeconds = 0;

let timerInterval = null;
let lastTimestamp = null;

// Display timer
function formatTime(seconds) {
    let hours = Math.floor(seconds / 3600);
    let minutes = Math.floor((seconds % 3600) / 60);
    let secs = seconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0")
    );
}

// Update screen
function updateDisplay() {
    document.getElementById("timer").textContent =
        formatTime(sessionSeconds);

    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);

    document.getElementById("totalHours").textContent =
        hours + "h " + minutes + "m";

    // Save total time
    localStorage.setItem("totalStudySeconds", totalSeconds);

    // Unlock rewards
    document.getElementById("diamond1").classList.toggle(
        "unlocked", totalSeconds >= 3600
    );

    document.getElementById("diamond2").classList.toggle(
        "unlocked", totalSeconds >= 18000
    );

    document.getElementById("diamond3").classList.toggle(
        "unlocked", totalSeconds >= 36000
    );

    document.getElementById("diamond4").classList.toggle(
        "unlocked", totalSeconds >= 90000
    );
}

// Start timer
function startTimer() {

    if (timerInterval !== null) return;

    lastTimestamp = Date.now();

    timerInterval = setInterval(() => {

        let now = Date.now();

        let elapsed = Math.floor((now - lastTimestamp) / 1000);

        if (elapsed > 0) {
            sessionSeconds += elapsed;
            totalSeconds += elapsed;
            lastTimestamp += elapsed * 1000;

            updateDisplay();
        }

    }, 250);
}

// Pause timer
function pauseTimer() {

    if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
        lastTimestamp = null;
        updateDisplay();
    }
}

// Reset current session only
function resetTimer() {

    pauseTimer();

    sessionSeconds = 0;

    updateDisplay();
}

// Initial display
updateDisplay();

</script>

</body>
</html>
